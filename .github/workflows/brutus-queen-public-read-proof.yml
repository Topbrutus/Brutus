name: Brutus Queen Public Read Proof

on:
  push:
    branches:
      - astra/queen-observation-ingress-v01-20260930
    paths:
      - .github/workflows/brutus-queen-public-read-proof.yml

permissions:
  contents: read

jobs:
  public-read-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Brutus
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install X72 adapter dependency
        run: python -m pip install --disable-pip-version-check websockets

      - name: Checkout audited Antmux adapter source
        run: |
          git init _antmux
          git -C _antmux remote add origin https://github.com/Topbrutus/Antmux.git
          git -C _antmux fetch --depth 1 origin bed68dbf0b8061b92ef15a9a9c5ae96d6cfc2e6b
          git -C _antmux checkout --detach FETCH_HEAD
          test "$(git -C _antmux rev-parse HEAD)" = "bed68dbf0b8061b92ef15a9a9c5ae96d6cfc2e6b"

      - name: Execute full public Queen read path
        env:
          QUEEN_BASE_URL: https://antmux.com/laboratoire/embryon-x72
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          import { createVersoRuntime, VERSO_DEFAULT_STATE } from "./src/verso-guard.mjs";
          import { createQueenObservationIngress } from "./src/ingestion/queen-observation-ingress.mjs";
          import { createVersoQueenClockAdapter } from "./src/adapters/verso-queen-clock.mjs";
          import { createX72AdapterProcessProvider } from "./src/providers/x72-adapter-process-provider.mjs";

          const card = JSON.parse(
            fs.readFileSync("./examples/cards/BRUTUS-CARD-QUEEN-CLOCK-0001.json", "utf8")
          );

          const provider = createX72AdapterProcessProvider({
            pythonExecutable: "python",
            bridgeScript: "./tools/x72_observation_bridge.py",
            antmuxRoot: "./_antmux",
            baseUrl: process.env.QUEEN_BASE_URL,
            timeoutMs: 10000
          });

          const ingress = createQueenObservationIngress();
          const adapter = createVersoQueenClockAdapter({
            ingress,
            readObservation: provider.readObservation,
            retryPolicy: {
              maxAttempts: 3,
              baseDelayMs: 100,
              maxDelayMs: 400
            }
          });
          const runtime = createVersoRuntime({ mutableValues: [] });

          const outcome = await runtime.execute(card, adapter);

          assert.equal(outcome.ok, true);
          assert.equal(outcome.result.USABLE, true);
          assert.equal(outcome.result.DATA.entity_id, "QUEEN-X72-0072");
          assert.equal(outcome.result.DATA.status, "FRESH");
          assert.equal(outcome.result.PROOF.integrity_match, true);
          assert.equal(outcome.result.PROOF.identity_continuity, true);
          assert.equal(outcome.result.PROOF.freshness_status, "FRESH");
          assert.equal(runtime.state, VERSO_DEFAULT_STATE);
          assert.equal(outcome.trace.at(-1), "DEFAULT_LOCKED");

          const proof = {
            schema: "BRUTUS-PROOF-QUEEN-PUBLIC-READ-v0.1",
            brutus_head: process.env.GITHUB_SHA,
            antmux_adapter_head: "bed68dbf0b8061b92ef15a9a9c5ae96d6cfc2e6b",
            queen_base_url: process.env.QUEEN_BASE_URL,
            card_id: outcome.cardId,
            entity_id: outcome.result.DATA.entity_id,
            tick: outcome.result.DATA.tick,
            generation: outcome.result.DATA.generation,
            queen_mode: outcome.result.DATA.queen_mode,
            reference_h256: outcome.result.DATA.reference_h256,
            status: outcome.result.DATA.status,
            condition: outcome.result.DATA.condition,
            integrity_match: outcome.result.PROOF.integrity_match,
            trace: outcome.trace,
            final_state: runtime.state,
            live_ant_routing: "DENIED"
          };

          fs.writeFileSync(
            "/tmp/brutus-queen-public-read-proof.json",
            JSON.stringify(proof, null, 2) + "\n",
            "utf8"
          );
          console.log(JSON.stringify(proof));
          NODE

      - name: Show proof summary
        run: |
          cat /tmp/brutus-queen-public-read-proof.json
          {
            echo '## Brutus Queen public read proof'
            echo
            echo '~~~json'
            cat /tmp/brutus-queen-public-read-proof.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
